<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Объявления о продаже машин</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
</head>
<body>
<header th:insert="~{blocks/header :: header}"></header>
<div class="container mt-4">

    <!-- Заголовок и кнопка добавления -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Объявления о продаже машин</h1>
        <a th:href="@{/posts/create}" class="btn btn-primary">
            Добавить объявление
        </a>
    </div>

    <!-- Фильтры -->
    <div class="mb-4">
        <div class="btn-group" role="group">
            <a th:href="@{/posts}"
               th:class="'btn btn-outline-primary' + (${filter == 'all'} ? ' active' : '')">
                Все
            </a>
            <a th:href="@{/posts/last-day}"
               th:class="'btn btn-outline-primary' + (${filter == 'last-day'} ? ' active' : '')">
                За последний день
            </a>
            <a th:href="@{/posts/with-photo}"
               th:class="'btn btn-outline-primary' + (${filter == 'with-photo'} ? ' active' : '')">
                С фото
            </a>
        </div>
    </div>

    <!-- Таблица объявлений -->
    <table class="table table-striped" th:if="${not #lists.isEmpty(posts)}">
        <thead>
        <tr>
            <th scope="col">#</th>
            <th scope="col">Фото</th>
            <th scope="col">Машина</th>
            <th scope="col">Описание</th>
            <th scope="col">Автор</th>
            <th scope="col">Дата создания</th>
            <th scope="col">Статус</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="post : ${posts}">
            <td th:text="${post.id}">1</td>
            <td>
                <img th:if="${post.photo != null and !post.photo.isEmpty()}"
                     th:src="@{${post.photo}}"
                     alt="Фото"
                     class="img-thumbnail"
                     style="max-width: 100px; max-height: 100px;">
                <span th:if="${post.photo == null or post.photo.isEmpty()}" class="text-muted">—</span>
            </td>
            <td th:text="${post.car != null ? post.car.brand.name + ' ' + post.car.model.name : '—'}">
                Renault Logan
            </td>
            <td>
                <a th:href="@{/posts/{id}(id=${post.id})}"
                   th:text="${post.description}"></a>
            </td>
            <td th:text="${post.user != null ? post.user.login : '—'}">admin</td>
            <td th:text="${#temporals.format(post.created, 'dd.MM.yyyy HH:mm')}">01.01.2026</td>
            <td>
                <span th:if="${post.sold}" class="badge bg-danger">Продано</span>
                <span th:unless="${post.sold}" class="badge bg-success">В продаже</span>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- Сообщение, если объявлений нет -->
    <div th:if="${#lists.isEmpty(posts)}" class="alert alert-info">
        Объявлений пока нет. <a th:href="@{/posts/create}">Создайте первое</a>.
    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
</body>
</html>
