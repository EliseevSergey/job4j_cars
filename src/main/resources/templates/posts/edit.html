<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Редактировать объявление</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<header th:insert="~{blocks/header :: header}"></header>
<div class="container mt-5">
  <div class="row">
    <div class="col-12">
      <h1>Редактировать объявление #<span th:text="${post.id}"></span></h1>

      <form th:action="@{/posts/{id}/edit(id=${post.id})}"
            method="post"
            enctype="multipart/form-data">

        <!-- VIN -->
        <div class="mb-3">
          <label for="vin" class="form-label"><b>VIN</b></label>
          <input type="text" class="form-control" id="vin" name="vin"
                 th:value="${post.car.vin}"
                 maxlength="17" minlength="17" required>
        </div>

        <!-- Бренд -->
        <div class="mb-3">
          <label for="brandId" class="form-label"><b>Марка</b></label>
          <select class="form-select" id="brandId" name="brandId" required>
            <option value="">Выберите марку</option>
            <option th:each="brand : ${brands}"
                    th:value="${brand.id}"
                    th:text="${brand.name}"
                    th:selected="${post.car.brand.id == brand.id}">
            </option>
          </select>
        </div>

        <!-- Модель (загружается через AJAX) -->
        <div class="mb-3">
          <label for="modelId" class="form-label"><b>Модель</b></label>
          <select class="form-select" id="modelId" name="modelId" required>
            <option th:value="${post.car.model.id}"
                    th:text="${post.car.model.name}"
                    th:selected="true">
            </option>
          </select>
        </div>

        <!-- Цвет -->
        <div class="mb-3">
          <label for="colorId" class="form-label"><b>Цвет</b></label>
          <select class="form-select" id="colorId" name="colorId" required>
            <option value="">Выберите цвет</option>
            <option th:each="color : ${colors}"
                    th:value="${color.id}"
                    th:text="${color.name}"
                    th:selected="${post.car.color.id == color.id}">
            </option>
          </select>
        </div>

        <!-- Топливо -->
        <div class="mb-3">
          <label for="fuelId" class="form-label"><b>Топливо</b></label>
          <select class="form-select" id="fuelId" name="fuelId" required>
            <option value="">Выберите топливо</option>
            <option th:each="fuel : ${fuels}"
                    th:value="${fuel.id}"
                    th:text="${fuel.name}"
                    th:selected="${post.car.engine.fuel.id == fuel.id}">
            </option>
          </select>
        </div>

        <!-- Объём -->
        <div class="mb-3">
          <label for="volume" class="form-label"><b>Объём двигателя (л)</b></label>
          <input type="number" class="form-control" id="volume" name="volume"
                 th:value="${post.car.engine.volume}"
                 step="0.1" min="0.1" max="10" required>
        </div>

        <!-- Мощность -->
        <div class="mb-3">
          <label for="horsePower" class="form-label"><b>Мощность (л.с.)</b></label>
          <input type="number" class="form-control" id="horsePower" name="horsePower"
                 th:value="${post.car.engine.horsePower}"
                 min="1" max="2000" required>
        </div>

        <!-- Описание -->
        <div class="mb-3">
          <label for="description" class="form-label"><b>Описание</b></label>
          <textarea class="form-control" id="description" name="description"
                    rows="4" required th:text="${post.description}"></textarea>
        </div>

        <!-- Текущее фото -->
        <div class="mb-3" th:if="${post.photo != null and !post.photo.isEmpty()}">
          <label class="form-label"><b>Текущее фото</b></label>
          <div>
            <img th:src="@{${post.photo}}" alt="Фото"
                 class="img-thumbnail" style="max-width: 200px;">
          </div>
        </div>

        <!-- Новое фото -->
        <div class="mb-3">
          <label for="photo" class="form-label"><b>Новое фото</b></label>
          <input type="file" class="form-control" id="photo" name="photo"
                 accept="image/*">
          <small class="form-text text-muted">
            Оставьте пустым, чтобы сохранить текущее фото
          </small>
        </div>

        <!-- Кнопки -->
        <div class="mt-4">
          <a th:href="@{/posts/{id}(id=${post.id})}"
             class="btn btn-secondary">Отмена</a>
          <button type="submit" class="btn btn-primary">Сохранить</button>
        </div>

      </form>
    </div>
  </div>
</div>

<script>
    // Загрузка моделей при смене бренда
    document.getElementById('brandId').addEventListener('change', function() {
        const brandId = this.value;
        const modelSelect = document.getElementById('modelId');
        modelSelect.innerHTML = '<option value="">Загрузка...</option>';

        if (!brandId) {
            modelSelect.innerHTML = '<option value="">Сначала выберите марку</option>';
            return;
        }

        fetch('/api/models?brandId=' + brandId)
            .then(response => response.json())
            .then(models => {
                modelSelect.innerHTML = '<option value="">Выберите модель</option>';
                models.forEach(m => {
                    const option = document.createElement('option');
                    option.value = m.id;
                    option.textContent = m.name;
                    modelSelect.appendChild(option);
                });
            })
            .catch(err => {
                modelSelect.innerHTML = '<option value="">Ошибка загрузки</option>';
                console.error(err);
            });
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
